name: devops-lab4
x-zk-base: &zk-base
  image: zookeeper:3.9.6-jre-17
  restart: unless-stopped
  environment: &zk-env
    ZOO_TICK_TIME: "2000"
    ZOO_INIT_LIMIT: "10"
    ZOO_SYNC_LIMIT: "5"
    ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr,mntr,conf,cons"
    ZOO_SERVERS: "server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181"
  networks: [lab4_net]
services:
  zk1:
    <<: *zk-base
    container_name: lab4-zk1
    environment:
      <<: *zk-env
      ZOO_MY_ID: "1"
    ports: ["127.0.0.1:2181:2181"]
    volumes: [zk1-data:/data, zk1-logs:/datalog]
  zk2:
    <<: *zk-base
    container_name: lab4-zk2
    environment:
      <<: *zk-env
      ZOO_MY_ID: "2"
    ports: ["127.0.0.1:2182:2181"]
    volumes: [zk2-data:/data, zk2-logs:/datalog]
  zk3:
    <<: *zk-base
    container_name: lab4-zk3
    environment:
      <<: *zk-env
      ZOO_MY_ID: "3"
    ports: ["127.0.0.1:2183:2181"]
    volumes: [zk3-data:/data, zk3-logs:/datalog]
  worker-a:
    build: .
    image: lab4-coordinator:local
    profiles: ["workers"]
    container_name: lab4-coordinator-a
    working_dir: /app
    entrypoint: ["python", "-u"]
    command: ["coordinator.py", "--worker", "a"]
    environment: &worker-env
      ZK_HOSTS: "zk1:2181,zk2:2181,zk3:2181"
      LAB4_RUN: "${LAB4_RUN:-dryrun}"
      FENCING: "${FENCING:-0}"
      WORK_DELAY: "${WORK_DELAY:-0.45}"
    volumes:
      - ./:/app
      - ../results/optimized/devops_skills.csv:/inputs/devops_skills.csv:ro
      - ../results/mapreduce/skills_2.csv:/inputs/skills_2.csv:ro
    networks: [lab4_net]
    depends_on: [zk1, zk2, zk3]
  worker-b:
    build: .
    image: lab4-coordinator:local
    profiles: ["workers"]
    container_name: lab4-coordinator-b
    working_dir: /app
    entrypoint: ["python", "-u"]
    command: ["coordinator.py", "--worker", "b"]
    environment:
      <<: *worker-env
    volumes:
      - ./:/app
      - ../results/optimized/devops_skills.csv:/inputs/devops_skills.csv:ro
      - ../results/mapreduce/skills_2.csv:/inputs/skills_2.csv:ro
    networks: [lab4_net]
    depends_on: [zk1, zk2, zk3]
volumes:
  zk1-data:
  zk2-data:
  zk3-data:
  zk1-logs:
  zk2-logs:
  zk3-logs:
networks:
  lab4_net:
